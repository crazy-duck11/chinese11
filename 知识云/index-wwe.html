<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>衣见中华 - 维吾尔族服饰</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        /* ================= 基础重置 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Ma Shan Zheng', 'ZCOOL XiaoWei', 'KaiTi', 'STKaiti', serif;
        }

        body {
            background-color: #010206;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* 禁止所有图片和元素原生拖拽 */
        img {
            -webkit-user-drag: none;
            user-select: none;
        }

        /* Canvas 星空图层 */
        #space-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        /* ================= 1. 左上角标题 ================= */
        .hero-text {
            position: absolute;
            left: 4%;
            top: 6%;
            z-index: 10;
            opacity: 0;
            animation: fadeIn 2s ease 0.5s forwards;
        }

        .hero-text h1 {
            font-size: 48px;
            color: #fff;
            letter-spacing: 10px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(100, 200, 255, 0.6);
        }

        .hero-text p {
            font-size: 12px;
            color: #7b9cc2;
            letter-spacing: 8px;
            margin-left: 3px;
        }

        /* ================= 2. 左侧极简民族介绍 ================= */
        .intro-frame {
            position: absolute;
            top: 50%;
            left: 4%;
            transform: translateY(-50%);
            width: 220px;
            z-index: 10;
            border-left: 1px solid rgba(100, 200, 255, 0.4);
            padding-left: 15px;
            opacity: 0;
            animation: fadeIn 2s ease 1s forwards;
        }

        .intro-frame h2 {
            font-size: 16px;
            color: #a3e2ff;
            margin-bottom: 12px;
            letter-spacing: 2px;
            font-weight: normal;
        }

        .intro-frame p {
            font-size: 12px;
            line-height: 1.8;
            color: #6a809b;
            text-align: justify;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        /* ================= 3. 人物图片 ================= */
        /* 大图：维吾尔族 */
        .character-main {
            position: absolute;
            left: 55%;
            top: 5%;
            height: 95vh;
            z-index: 2;
            filter: drop-shadow(0 0 20px rgba(100, 200, 255, 0.2));
        }

        /* 小图通用样式 */
        .character-q {
            position: absolute;
            height: 15vh;
            z-index: 3;
            filter: drop-shadow(0 0 10px rgba(100, 200, 255, 0.5));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .character-q:hover {
            transform: translateY(-10px) scale(1.1);
            filter: drop-shadow(0 0 20px rgba(100, 200, 255, 0.8));
        }

        /* 小图固定位置 */
        .q-mgQ { left: 5%; top: 80%; }
        .q-mQ { left: 15%; top: 80%; }
        .q-zQ { left: 25%; top: 80%; }

        /* ================= 4. 互动光点 ================= */
        .pink-dot {
            position: absolute;
            width: 10px; height: 10px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer; /* 恢复鼠标小手 */
            box-shadow:
                0 0 10px #fff,
                0 0 20px #7ee0ff,
                0 0 40px #7ee0ff;
            animation: pulseLight 3s infinite alternate;
            z-index: 20;
        }

        /* 雷达扫描圈 */
        .pink-dot::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20px; height: 20px;
            border: 1px solid rgba(126, 224, 255, 0.5);
            border-radius: 50%;
            animation: radar 2s infinite linear;
            pointer-events: none;
        }

        @keyframes pulseLight {
            0% { box-shadow: 0 0 10px #fff, 0 0 20px #7ee0ff; }
            100% { box-shadow: 0 0 15px #fff, 0 0 30px #7ee0ff, 0 0 50px #7ee0ff; }
        }

        @keyframes radar {
            0% { width: 10px; height: 10px; opacity: 1; }
            100% { width: 50px; height: 50px; opacity: 0; }
        }

        .pink-dot:hover {
            transform: scale(1.5);
            box-shadow: 0 0 30px #fff, 0 0 60px #7ee0ff;
        }

        /* 悬浮文字标签 */
        .pink-dot::after {
            content: attr(data-name);
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            white-space: nowrap;
            font-size: 15px;
            color: #a3e2ff;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,0,0,1), 0 0 5px #000;
        }

        .point-left .pink-dot::after { right: 150%; }
        .point-right .pink-dot::after { left: 150%; }

        .pink-dot:hover::after { opacity: 1; }

        /* ================= 光点固定坐标 ================= */
        /* 如果您发现哪个点偏了，直接改这里的 left(左右) 和 top(上下) 即可 */
        .pos-1 { top: 12%; left: 58%; } /* 小花帽 */
        .pos-2 { top: 28%; left: 50%; } /* 发辫 */
        .pos-3 { top: 50%; left: 62%; } /* 艾德莱斯裙 */
        .pos-4 { top: 45%; left: 42%; } /* 坎肩 */
        .pos-5 { top: 88%; left: 55%; } /* 长靴 */

        /* ================= 5. 弹窗 ================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 2, 10, 0.8); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }

        .modal-content {
            background: rgba(5, 10, 25, 0.9);
            border: 1px solid rgba(126, 224, 255, 0.3);
            box-shadow: 0 0 40px rgba(126, 224, 255, 0.15);
            padding: 50px 40px; width: 600px; max-width: 90%;
            position: relative;
            animation: modalFadeIn 0.4s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .close-btn {
            position: absolute; top: 15px; right: 20px; font-size: 28px;
            color: #7ee0ff; cursor: pointer; font-family: sans-serif;
        }

        .modal-title {
            font-size: 28px; color: #7ee0ff; margin-bottom: 25px;
            text-align: center; letter-spacing: 4px;
        }

        .modal-desc {
            font-size: 16px; line-height: 2; color: #b0c4d8;
            font-family: 'Microsoft YaHei', sans-serif; text-align: justify;
        }

        /* ================= 底部提示 ================= */
        .click-hint {
            position: absolute; bottom: 3%; left: 50%; transform: translateX(-50%);
            z-index: 10; color: #7ee0ff; font-size: 13px; letter-spacing: 3px;
            opacity: 0; animation: fadeIn 2s ease 2s forwards; pointer-events: none;
        }

        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>

    <div class="hero-text">
        <h1>衣见中华</h1>
        <p>民族 · 科技 · 走向未来</p>
    </div>

    <div class="intro-frame">
        <h2>天山之花 · 维吾尔族</h2>
        <p>维吾尔族服饰色彩鲜艳，独具风情。最引人注目的是精美的“朵帕”（小花帽），以及色彩斑斓、如水波纹般的“艾德莱斯绸”连衣裙。女性常梳多条长辫，展现了西域大地的热情与灵动。</p>
    </div>

    <!-- 大图 -->
    <img src="wwe.png" class="character-main" alt="维吾尔族女孩">

    <!-- 左下角三个小人 -->
    <img src="mgQ.png" class="character-q" onclick="window.location.href='index-mg.html'" alt="蒙古族" style="left: 5%; top: 80%;">
    <img src="mQ.png" class="character-q" onclick="window.location.href='index-m.html'" alt="苗族" style="left: 15%; top: 80%;">
    <img src="zQ.png" class="character-q" onclick="window.location.href='index-z.html'" alt="藏族" style="left: 25%; top: 80%;">

    <!-- 交互光点 -->
    <div class="pink-dot point-right pos-1" data-name="维吾尔族小花帽" onclick="showModal('维吾尔族小花帽（朵帕）', '小花帽是维吾尔族服饰的灵魂标志，工艺精湛。多用黑、白或彩色丝线绣出各种几何、花卉图案。它不仅具有极高的审美价值，还常作为馈赠贵客的珍贵礼物。')"></div>

    <div class="pink-dot point-left pos-2" data-name="维吾尔族发辫" onclick="showModal('维吾尔族发辫', '维吾尔族女性以发辫为美，常将头发梳成数十条细密的麻花辫。辫子越多，越显青春靓丽。这不仅是一种发型，更是维吾尔族独特审美与生活习俗的展现。')"></div>

    <div class="pink-dot point-right pos-3" data-name="艾德莱斯绸裙" onclick="showModal('艾德莱斯绸裙', '艾德莱斯绸是维吾尔族的传统扎染绸，被称为“布谷鸟翅膀上的花纹”。其色彩奔放、图案如水波般流动，裁制成的连衣裙轻盈飘逸，极具西域风情。')"></div>

    <div class="pink-dot point-left pos-4" data-name="维吾尔族坎肩" onclick="showModal('维吾尔族坎肩', '在色彩绚丽的连衣裙外，维吾尔族女性常搭配一件深色或金丝绒的坎肩（马甲）。这既增加了服装的层次感，又能在温差较大的西域起到保暖作用。')"></div>

    <div class="pink-dot point-right pos-5" data-name="维吾尔族长靴" onclick="showModal('维吾尔族长靴', '传统维吾尔族服饰中，常搭配做工考究的皮靴。靴面常有精美的刺绣或雕花，靴筒贴合小腿，既适合在沙漠绿洲中行走，又与色彩斑斓的裙摆相得益彰。')"></div>

    <!-- 修改后的底部提示 -->
    <div class="click-hint">✦ 侦测到服饰星轨 · 点击光点解析 ✦</div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 class="modal-title" id="modalTitle">名称</h2>
            <p class="modal-desc" id="modalDesc">介绍...</p>
        </div>
    </div>

    <script>
        // ================= 核心星空引擎 =================
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            generateUniverse();
        }

        let stars = [];
        let planetDots = [];
        let ringDotsBack = [];
        let ringDotsFront = [];
        let meteors = [];

        function lerpColor(c1, c2, t) {
            return {
                r: Math.round(c1.r + (c2.r - c1.r) * t),
                g: Math.round(c1.g + (c2.g - c1.g) * t),
                b: Math.round(c1.b + (c2.b - c1.b) * t)
            };
        }

        function generateUniverse() {
            stars = Array.from({ length: 800 }, () => ({
                x: Math.random() * width, y: Math.random() * height,
                size: Math.random() * 1.2 + 0.5, alpha: Math.random(), speed: Math.random() * 0.02 + 0.005
            }));

            planetDots = [];
            const pX = width * 0.85; const pY = height * 0.85;
            const pR = Math.min(width, height) * 0.28;
            const lx = -0.707; const ly = -0.707;

            for (let i = 0; i < 40000; i++) {
                const angle = Math.random() * Math.PI * 2;
                const rNorm = Math.sqrt(Math.random());
                const r = rNorm * pR;
                const x = pX + Math.cos(angle) * r;
                const y = pY + Math.sin(angle) * r;
                const nx = (x - pX) / pR; const ny = (y - pY) / pR;
                const dot = nx * lx + ny * ly;
                const edgeFactor = Math.pow(rNorm, 6);
                if (Math.random() > 0.5 + edgeFactor * 0.5) continue;

                const lightIntensity = (dot + 1) / 2;
                let colorStr;
                if (lightIntensity > 0.7) {
                    const t = (lightIntensity - 0.7) / 0.3;
                    colorStr = `rgba(${180 + t*75}, ${230 + t*25}, 255, ${0.8 + t*0.2})`;
                } else if (lightIntensity > 0.3) {
                    const t = (lightIntensity - 0.3) / 0.4;
                    const c = lerpColor({r:60, g:120, b:200}, {r:180, g:230, b:255}, t);
                    colorStr = `rgba(${c.r}, ${c.g}, ${c.b}, 0.8)`;
                } else {
                    const t = lightIntensity / 0.3;
                    const c = lerpColor({r:20, g:10, b:40}, {r:60, g:120, b:200}, t);
                    colorStr = `rgba(${c.r}, ${c.g}, ${c.b}, ${0.3 + t*0.5})`;
                }
                planetDots.push({ x, y, size: Math.random() * 1.5 + 0.5, color: colorStr });
            }

            ringDotsBack = []; ringDotsFront = [];
            const ringTilt = -Math.PI / 10;

            for (let i = 0; i < 20000; i++) {
                const r = pR * (Math.random() * 0.8 + 1.3);
                const angle = Math.random() * Math.PI * 2;
                let ex = Math.cos(angle) * r;
                let ey = Math.sin(angle) * r * 0.25;
                const x = pX + ex * Math.cos(ringTilt) - ey * Math.sin(ringTilt);
                const y = pY + ex * Math.sin(ringTilt) + ey * Math.cos(ringTilt);

                const colorRand = Math.random();
                let colorStr;
                if (colorRand > 0.85) colorStr = `rgba(200, 100, 255, ${Math.random() * 0.6})`;
                else if (colorRand > 0.4) colorStr = `rgba(100, 200, 255, ${Math.random() * 0.8})`;
                else colorStr = `rgba(30, 80, 150, ${Math.random() * 0.5})`;

                const dot = { x, y, size: Math.random() * 1.2 + 0.3, color: colorStr };
                if (y > pY) { ringDotsFront.push(dot); } else { ringDotsBack.push(dot); }
            }
        }

        function createMeteor() {
            if (Math.random() > 0.02) return;
            meteors.push({
                x: width * (Math.random() * 0.5 + 0.5), y: Math.random() * height * 0.4,
                length: Math.random() * 150 + 100, speed: Math.random() * 8 + 5,
                angle: Math.PI / 4 + (Math.random() * 0.2 - 0.1), life: 1
            });
        }

        initCanvas();
        window.addEventListener('resize', initCanvas);

        function drawUniverse() {
            ctx.clearRect(0, 0, width, height);
            let gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);
            gradient.addColorStop(0, '#060914'); gradient.addColorStop(1, '#010206');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, width, height);

            stars.forEach(star => {
                star.alpha += (Math.random() - 0.5) * star.speed;
                if (star.alpha < 0.1) star.alpha = 0.1;
                if (star.alpha > 1) star.alpha = 1;
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            createMeteor();
            for (let i = meteors.length - 1; i >= 0; i--) {
                let m = meteors[i];
                m.x -= Math.cos(m.angle) * m.speed;
                m.y += Math.sin(m.angle) * m.speed;
                m.life -= 0.01;
                if (m.life <= 0 || m.x < 0 || m.y > height) { meteors.splice(i, 1); continue; }
                const endX = m.x + Math.cos(m.angle) * m.length;
                const endY = m.y - Math.sin(m.angle) * m.length;
                const grad = ctx.createLinearGradient(m.x, m.y, endX, endY);
                grad.addColorStop(0, `rgba(255, 255, 255, ${m.life})`);
                grad.addColorStop(1, 'rgba(126, 224, 255, 0)');
                ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(endX, endY);
                ctx.strokeStyle = grad; ctx.lineWidth = 2; ctx.stroke();
            }

            ringDotsBack.forEach(dot => { ctx.fillStyle = dot.color; ctx.fillRect(dot.x, dot.y, dot.size, dot.size); });
            planetDots.forEach(dot => { ctx.fillStyle = dot.color; ctx.fillRect(dot.x, dot.y, dot.size, dot.size); });
            ringDotsFront.forEach(dot => { ctx.fillStyle = dot.color; ctx.fillRect(dot.x, dot.y, dot.size, dot.size); });

            requestAnimationFrame(drawUniverse);
        }
        drawUniverse();

        // ================= 交互逻辑 =================
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');

        function showModal(title, description) {
            modalTitle.innerText = title;
            modalDesc.innerText = description;
            modalOverlay.style.display = 'flex';
        }

        function closeModal() {
            modalOverlay.style.display = 'none';
        }

        modalOverlay.addEventListener('click', function(event) {
            if (event.target === modalOverlay) closeModal();
        });
    </script>
</body>
</html>
